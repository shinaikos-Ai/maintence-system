services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - private_files:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
  scheduler:
    build: .
    command: php artisan schedule:work
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - private_files:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cmf}
      POSTGRES_USER: ${DB_USERNAME:-cmf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  private_files:
